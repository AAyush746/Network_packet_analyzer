name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting-relevant syntax and types are importable
        run: python -m compileall -q pktanalyzer main.py bench.py

      # No xvfb dependency: the GUI tests skip themselves when Tk cannot open
      # a display, which is the correct behaviour on a headless runner.
      - name: Test with coverage
        run: pytest --cov=pktanalyzer --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scapy
        run: |
          python -m pip install --upgrade pip
          pip install scapy

      # Committed on every push so throughput regressions are visible in the
      # diff rather than being rediscovered later.
      - name: Run benchmark
        run: python bench.py --packets 20000 | tee benchmark.txt

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.txt